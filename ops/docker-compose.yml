name: genesis-enterprise
# Local substrate for Genesis OS — Enterprise Decision Intelligence.
#   docker compose up -d
# Temporal UI:  http://localhost:8236
# MinIO UI:     http://localhost:9021  (minioadmin / minioadmin)
# (Confluent Cloud is the hosted ledger stream — env-configured, no local container.)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis
      POSTGRES_DB: genesis_enterprise
    ports: ["5436:5432"]
    volumes:
      - pgdata_enterprise:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports: ["4226:4222"]

  redis:
    image: redis:7-alpine
    ports: ["6383:6379"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9020:9000", "9021:9001"]
    volumes:
      - miniodata_enterprise:/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: genesis
      POSTGRES_PWD: genesis
      POSTGRES_SEEDS: postgres
    ports: ["7236:7233"]
    depends_on: [postgres]

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8236
    ports: ["8236:8080"]
    depends_on: [temporal]

volumes:
  pgdata_enterprise:
  miniodata_enterprise:
